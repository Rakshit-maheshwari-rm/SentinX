<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="SentinX: MERN-powered autonomous disaster relief network with zero-API algorithmic triage engine." />
  <meta name="theme-color" content="#06b6d4" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="alternate icon" href="/favicon.ico" />

  <link rel="manifest" href="/manifest.json" />
  <title>SentinX — Autonomous Disaster Response &amp; Emergency Command Network</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <script>
    if ('serviceWorker' in navigator) {
      const isLocalDev = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
      if (isLocalDev) {
        
        navigator.serviceWorker.getRegistrations().then(regs => {
          for (const reg of regs) reg.unregister();
        });
        if ('caches' in window) {
          caches.keys().then(keys => keys.forEach(k => caches.delete(k)));
        }
      } else {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(
            (reg) => console.log('[SentinX PWA] Service worker registered:', reg.scope),
            (err) => console.warn('[SentinX PWA] SW registration failed:', err)
          );
        });
      }
    }
  </script>
</body>

</html>
